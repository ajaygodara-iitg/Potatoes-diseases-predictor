<!DOCTYPE html>
<html>
<head>
    <title>Farmer Responses</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        th {
            background: #007bff;
            color: white;
        }
        tr:nth-child(even) {
            background: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Saved Farmer Responses</h1>
    <table id="responsesTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Disease Name</th>
                <th>Question</th>
                <th>Answer</th>
                <th>Timestamp</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        async function loadResponses() {
            const res = await fetch('http://localhost:8080/responses');
            const data = await res.json();
            const tbody = document.querySelector('#responsesTable tbody');
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5">No responses found</td></tr>';
                return;
            }
            data.forEach(r => {
                const row = `<tr>
                    <td>${r.id}</td>
                    <td>${r.disease_name}</td>
                    <td>${r.question}</td>
                    <td>${r.answer}</td>
                    <td>${r.timestamp}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        loadResponses();
    </script>
</body>
</html>
